[supervisord]
nodaemon=true
pidfile=/run/remote-chrome/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0

[program:xvfb]
priority=10
command=/usr/bin/Xvfb :99 -screen 0 %(ENV_SCREEN_GEOMETRY)s -nolisten tcp
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
priority=20
command=/usr/bin/openbox --display :99
environment=DISPLAY=":99",HOME="/home/remote-chrome"
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:chrome]
priority=30
command=/usr/bin/google-chrome
  --display=:99
  --remote-debugging-port=9222
  --remote-debugging-address=127.0.0.1
  --user-data-dir=/data/chrome-profile
  --password-store=basic
  --no-first-run
  --no-default-browser-check
  --disable-dev-shm-usage
  --no-sandbox
environment=DISPLAY=":99",HOME="/home/remote-chrome"
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:x11vnc]
priority=40
command=/usr/bin/x11vnc -display :99 -rfbport 5900 -listen 127.0.0.1 -forever -shared -nopw
environment=DISPLAY=":99",HOME="/home/remote-chrome"
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
priority=50
command=/usr/bin/websockify --web=/usr/share/novnc/ 0.0.0.0:6080 127.0.0.1:5900
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:playwright-mcp]
priority=60
command=/usr/local/bin/playwright-mcp
  --cdp-endpoint http://127.0.0.1:9222
  --host 0.0.0.0
  --port 8931
  --allowed-hosts=*
  --shared-browser-context
  --cdp-timeout 10000
environment=HOME="/home/remote-chrome",NODE_PATH="/usr/local/lib/node_modules/@playwright/mcp/node_modules:/usr/local/lib/node_modules",NODE_OPTIONS="--require=/opt/remote-chrome/inject-instructions.cjs",REMOTE_CHROME_PLAYBOOK="/opt/remote-chrome/browser-playbook.md"
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
