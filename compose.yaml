services:
  browser:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PLAYWRIGHT_MCP_VERSION: ${PLAYWRIGHT_MCP_VERSION:?set PLAYWRIGHT_MCP_VERSION}
    environment:
      SCREEN_GEOMETRY: ${SCREEN_GEOMETRY:-1440x900x24}
      REMOTE_CHROME_MCP_SESSION_IDLE_TIMEOUT_MS: ${REMOTE_CHROME_MCP_SESSION_IDLE_TIMEOUT_MS:-1800000}
      REMOTE_CHROME_LOGIN_TOKEN_URL: https://${DOMAIN:?set DOMAIN}/login/?token=${LOGIN_TOKEN:?set LOGIN_TOKEN}
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    shm_size: "2gb"
    volumes:
      - chrome-profile:/data/chrome-profile
    expose:
      - "6080"
      - "8931"
    networks:
      - browser-net
    healthcheck:
      test: ["CMD", "/opt/remote-chrome/healthcheck.sh"]
      interval: 15s
      timeout: 12s
      retries: 8
      start_period: 20s

  proxy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      MCP_TOKEN: ${MCP_TOKEN:?set MCP_TOKEN}
      LOGIN_TOKEN: ${LOGIN_TOKEN:?set LOGIN_TOKEN}
      LOGIN_USERNAME: ${LOGIN_USERNAME:?set LOGIN_USERNAME}
      LOGIN_PASSWORD_HASH: ${LOGIN_PASSWORD_HASH:?set LOGIN_PASSWORD_HASH}
    init: true
    restart: unless-stopped
    depends_on:
      browser:
        condition: service_healthy
    ports:
      - "${PROXY_BIND_ADDRESS:-0.0.0.0}:${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_BIND_ADDRESS:-0.0.0.0}:${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - browser-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- --header=\"Host: $${DOMAIN}\" http://127.0.0.1/healthz | grep -qx ready",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

networks:
  browser-net:
    driver: bridge

volumes:
  chrome-profile:
  caddy-data:
  caddy-config:
